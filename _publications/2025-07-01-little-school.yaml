title: "Little School on the Prairie: A Push for Structural Transformation (Job Market Paper)"
collection: publications
category: working
#permalink: /publication/2025-07-01-little-school
excerpt: 'The one room school looms large in North American history, but we have little information on the role these rural schools played in economic development. Using linked full count census records from the early 20th century Canadian prairies combined with precise geolocations for individual households and schools, I examine the effect of the roll out of one room schools on children’s education participation and later life outcomes. I find that geographic proximity plays an important roll in education participation, and educational participation correlates with adult income and decreases the likelihood of working in agriculture. Expanding to a difference in differences strategy exploiting the timing of school rollout, I find that a treated child who had a school constructed nearby is less likely to be in agriculture as an adult, lives further from their childhood home, and has higher income. They are significantly more likely to work in a high skill services occupation, including as teachers, as adults. This suggests that education access can act as a push factor for structural transformation out of agriculture in rural areas.'
