title: "Bridging the 49th Parallel: Matching Histories across the US-Canadian border"
collection: publications
category: works-in-progress
#permalink: /publication/2025-06-30-bridging-49
excerpt: With Kevin Didi, <a href="https://sharieli.ca" target="_blank">Shari Eli</a>, and <a href="https://sites.google.com/view/stephanheblich/about" target="_blank">Stephan Heblich</a>. <br><br> Alexander Graham Bell was born in Scotland, emigrated to Canada following a family tragedy, and soon moved to the United States in search of better opportunities for his work teaching the deaf. His work eventually led to the invention of the telephone. By linking individual census records between Canada and the U.S. from this transformative period, we aim to uncover personal histories like that of Alexander Graham Bell while systematically documenting how cross-border migration flows shaped socioeconomic development on both sides of the border. This analysis will provide deeper insights into how migration influenced labor markets, industrial growth, and agricultural expansion in two nations that emerged as key players in the global economy during this time.
